name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepara la firma permanente
        env:
          SUDOKU_KEYSTORE_BASE64: ${{ secrets.SUDOKU_KEYSTORE_BASE64 }}
        run: |
          test -n "$SUDOKU_KEYSTORE_BASE64"
          printf '%s' "$SUDOKU_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sudoku-release.jks"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compila APK release firmato
        env:
          SUDOKU_KEYSTORE_PATH: ${{ runner.temp }}/sudoku-release.jks
          SUDOKU_KEYSTORE_PASSWORD: ${{ secrets.SUDOKU_KEYSTORE_PASSWORD }}
          SUDOKU_KEY_ALIAS: ${{ secrets.SUDOKU_KEY_ALIAS }}
          SUDOKU_KEY_PASSWORD: ${{ secrets.SUDOKU_KEY_PASSWORD }}
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: SudokuApp-APK
          path: app/build/outputs/apk/release/app-release.apk
